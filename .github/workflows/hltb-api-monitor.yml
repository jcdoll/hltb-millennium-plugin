name: HLTB API Monitor

# Exercise the plugin's discovery, authentication, search, and retry logic.
# Keep request construction in the backend so optional API fields cannot drift.
on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and JSON decoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 lua-dkjson

      - name: Search via plugin client and validate completion times
        run: lua5.4 scripts/check-hltb-api.lua
